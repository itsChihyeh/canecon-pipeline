[project]
name = "canecon"
version = "0.1.0"
description = "Collect Canadian economic data with vintage tracking and lineage"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
canecon-collect = "canecon.collect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canecon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
