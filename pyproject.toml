[project]
name = "canecon"
version = "0.1.0"
description = "Collect Canadian economic data with vintage tracking and lineage"
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "httpx>=0.27",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.17.4",
    "scikit-learn>=1.9.1",
]
orchestration = [
    "dagster>=1.13.29",
]

[project.scripts]
canecon-collect = "canecon.collect:main"
canecon-backfill = "canecon.collect:backfill_main"
canecon-build = "canecon.build:main"
canecon-catchup = "canecon.collect:catchup_main"
canecon-demo-failure = "canecon.demo:main"
canecon-export = "canecon.export:main"
canecon-brief = "canecon.brief:main"
canecon-baseline = "canecon.baseline:main"

[project.optional-dependencies]
ai = [
    "openai>=3.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canecon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long lines are left to the formatter; some strings and SQL stay long

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
