name: Daily collect

on:
  schedule:
    # 13:47 UTC = 08:47 EST / 09:47 EDT, after StatCan's 08:30 ET releases.
    # Off the hour and early on purpose: GitHub starts scheduled runs late under load
    # (the 15:00 UTC runs of 2026-11-07..10 started 4 to 9 hours late, one of them 19
    # minutes before the UTC day ended). A run that slips past midnight UTC leaves a
    # missing day, which the next daily run now catches up by itself (step below).
    - cron: "47 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = normal collection; catchup = fill missed days; backfill_gdp = one-time fetch of official GDP vintages (36-10-0491)"
        type: choice
        options: [daily, catchup, backfill_gdp]
        default: daily
      dates:
        description: "catchup only: UTC days separated by spaces, e.g. 2026-11-05 2026-11-06 (empty = every missed day)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write # only for re-enabling this workflow (keep-alive step)

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add data-branch origin/data
            git -C data-branch switch -c data
          else
            git worktree add --orphan -b data data-branch
          fi

      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked

      - name: Collect
        id: collect
        env:
          MODE: ${{ inputs.mode || 'daily' }}
          DATES: ${{ inputs.dates }}
        run: |
          case "$MODE" in
            backfill_gdp) uv run canecon-backfill --data-dir data-branch/raw ;;
            catchup)
              args=()
              for d in $DATES; do
                [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::bad date '$d'"; exit 2; }
                args+=(--date "$d")
              done
              uv run canecon-catchup --data-dir data-branch/raw "${args[@]}" ;;
            *) uv run canecon-collect --data-dir data-branch/raw ;;
          esac
        continue-on-error: true

      # Daily runs also fill any earlier day that has no successful run (for example a
      # scheduled run GitHub started after midnight UTC, or a day the APIs were down).
      # With no missed days this prints "nothing_to_catch_up" and makes no requests.
      - name: Catch up missed days (daily runs only)
        id: catchup
        if: (inputs.mode || 'daily') == 'daily' && steps.collect.outcome == 'success'
        run: uv run canecon-catchup --data-dir data-branch/raw
        continue-on-error: true

      - name: Commit snapshots to data branch
        working-directory: data-branch
        env:
          MODE: ${{ inputs.mode || 'daily' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw
          if git diff --cached --quiet; then
            echo "nothing new to commit (e.g. catch-up found no missed days)"
            exit 0
          fi
          git commit -m "Collect $(date -u +%Y-%m-%dT%H:%MZ) $MODE (${{ steps.collect.outcome }})"
          git push origin data

      - name: Build warehouse, run dbt models, tests and data quality checks
        id: build
        run: uv run canecon-build --data-dir data-branch/raw --db warehouse.duckdb
        continue-on-error: true

      # GitHub disables scheduled workflows in public repos after 60 days without
      # "repository activity". Whether bot commits to the data branch count is not
      # documented, so re-enable the workflow on every run. Whether this resets the
      # 60-day timer is also undocumented; see docs/reliability.md.
      - name: Keep the schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable collect.yml --repo "$GITHUB_REPOSITORY" || echo "::warning::could not re-enable the workflow"

      - name: Fail if any request or check failed
        if: steps.collect.outcome != 'success' || steps.catchup.outcome == 'failure' || steps.build.outcome != 'success'
        run: |
          echo "::error::collect=${{ steps.collect.outcome }} catchup=${{ steps.catchup.outcome }} build=${{ steps.build.outcome }}; see data-branch/raw/runs.jsonl and the step logs"
          exit 1
